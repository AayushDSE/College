<!DOCTYPE html>
<html>
<head>
    <title>My College</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        nav {
            background: black;
            padding: 15px;
        }

        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }

        .content {
            padding: 20px;
        }

        img {
            width: 250px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background: lightgray;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#students">Students</a>
        <a href="#about">About</a>
    </nav>

    <div class="content" id="home">
        <h1>Welcome to My College</h1>
        <p>This is my college webpage.</p>

        <img src="https://placehold.co/400x200"
             alt="College image">

        <h2 id="students">Student Details</h2>

        <table>
            <tr>
                <th>Name</th>
                <th>Roll Number</th>
                <th>Course</th>
            </tr>

            <tr>
                <td>Aman</td>
                <td>101</td>
                <td>IT</td>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>102</td>
                <td>Computer Science</td>
            </tr>
        </table>

        <h2 id="about">About Us</h2>
        <p>This webpage uses HTML and CSS.</p>
    </div>

</body>
</html>

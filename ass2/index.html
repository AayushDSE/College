<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Book — Student Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sheet">
  <div class="sheet-header">
    <div class="seal">RECORD</div>
    <div>
      <h1>Grade Book</h1>
      <p>Student entry &amp; percentage register</p>
    </div>
  </div>

  <div class="body-area">
    <p class="section-label">New Entry</p>
    <form id="student-form">
      <div class="field">
        <label for="s-name">Student Name</label>
        <input type="text" id="s-name" placeholder="e.g. Aarav Sharma" required>
      </div>
      <div class="field">
        <label for="s-roll">Roll No.</label>
        <input type="text" id="s-roll" placeholder="e.g. 21" required>
      </div>

      <div class="marks-row">
        <div class="field">
          <label for="m1">Full Stack (/100)</label>
          <input type="number" id="m1" min="0" max="100" required>
        </div>
        <div class="field">
          <label for="m2">Data Structures and Algorithms (/100)</label>
          <input type="number" id="m2" min="0" max="100" required>
        </div>
        <div class="field">
          <label for="m3">Computer Networks (/100)</label>
          <input type="number" id="m3" min="0" max="100" required>
        </div>
        <div class="field">
          <label for="m4">Design Algorithms and Analysis(/100)</label>
          <input type="number" id="m4" min="0" max="100" required>
        </div>
        <div class="field">
          <label for="m5">Automata Theory (/100)</label>
          <input type="number" id="m5" min="0" max="100" required>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="primary">Add Record</button>
        <span class="form-msg" id="form-msg"></span>
      </div>
    </form>

    <hr class="divider">

    <p class="section-label">Register</p>
    <div id="table-wrap">
      <div class="loading">Loading ledger…</div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>

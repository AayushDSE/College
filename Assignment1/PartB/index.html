
<!DOCTYPE html>
<html>
<head>
    <title> Box Animation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="boxarea">

        <div class="name">Hello World</div>

        <div class="left">
            <div class="box pink"></div>
            <div class="box blue"></div>
        </div>

        <div class="right">
            <div class="box orange"></div>
            <div class="box green"></div>
        </div>

    </div>

</body>
</html>
